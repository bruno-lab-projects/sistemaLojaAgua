# Gerado no build: o Maven substitui a variável abaixo pela versão real do
# projeto (filtragem de resources configurada no pom.xml). Nao editar a mao.
app.version=${project.version}

# Pasta base dos arquivos de atualização publicados no GitHub Releases.
# O "latest" é resolvido pelo próprio GitHub, que responde com um redirect 302.
app.update.base=https://github.com/projects-bruno/sistemaLojaAgua/releases/latest/download
